name: 24/7 Telegram Ad Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart-bot]

# لإلغاء أي تشغيل قديم ومنع تعارض نسختين في نفس اللحظة
concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot for exactly 5 hours
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # تشغيل البوت لمدة 5 ساعات (18000 ثانية) ثم إيقافه تلقائياً
          timeout --preserve-status 18000s python bot.py || true

      - name: Trigger next workflow automatically
        if: always()
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "restart-bot"}'
